name: Release
on:
  push:
    tags:
      - "v*"
jobs:
  image:
    name: Push Container Image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write # docker push to ghcr.io
      id-token: write # Takumi Guard (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
      - uses: flatt-security/setup-takumi-guard-golang@02545d3425218766aac4dca114dcc3f6eaa0df4a # v1.3.0
        with:
          bot-id: ${{ vars.TAKUMI_GUARD_BOT_ID }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: linux/amd64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build necoperf-cli and necoperf-daemon image
        run: make docker-build
      - name: Push necoperf-cli and necoperf-daemon image
        run: |
          IMAGE_TAG=${GITHUB_REF#refs/tags/v} # Remove "v" prefix.
          docker tag necoperf-cli:dev ghcr.io/cybozu-go/necoperf-cli:$IMAGE_TAG
          docker push ghcr.io/cybozu-go/necoperf-cli:$IMAGE_TAG
          docker tag necoperf-daemon:dev ghcr.io/cybozu-go/necoperf-daemon:$IMAGE_TAG
          docker push ghcr.io/cybozu-go/necoperf-daemon:$IMAGE_TAG
  release:
    name: Release on GitHub
    needs: image
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write # Takumi Guard (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
      - uses: flatt-security/setup-takumi-guard-golang@02545d3425218766aac4dca114dcc3f6eaa0df4a # v1.3.0
        with:
          bot-id: ${{ vars.TAKUMI_GUARD_BOT_ID }}
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
